<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBench Pro - Planlegger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0a0f1a; min-height: 100vh; padding: 20px; }
        .app-wrapper { max-width: 1600px; margin: 0 auto; }
        .pro-header {
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            border-radius: 24px;
            padding: 20px 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .logo-area h1 { color: white; font-size: 1.6rem; }
        .logo-area p { color: #94a3b8; font-size: 0.8rem; }
        .user-area { display: flex; align-items: center; gap: 16px; background: #1e293b; padding: 8px 20px; border-radius: 60px; }
        .user-name { color: #e2e8f0; font-weight: 500; }
        .home-btn { background: #3b82f6; color: white; text-decoration: none; padding: 6px 16px; border-radius: 30px; }
        .logout-btn { background: #dc2626; border: none; padding: 6px 16px; border-radius: 30px; color: white; cursor: pointer; }
        
        /* Kalender og To-Do Grid */
        .planner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        @media (max-width: 900px) {
            .planner-grid { grid-template-columns: 1fr; }
        }
        
        /* Kalender styling */
        .calendar-container {
            background: #111827;
            border-radius: 28px;
            padding: 1.5rem;
            border: 1px solid #1f2a3e;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .calendar-month {
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
        }
        .calendar-nav {
            display: flex;
            gap: 8px;
        }
        .calendar-nav button {
            background: #1e293b;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .calendar-nav button:hover {
            background: #3b82f6;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 12px;
        }
        .calendar-weekday {
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 8px;
            font-weight: 600;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .calendar-day {
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            color: white;
            position: relative;
        }
        .calendar-day:hover {
            background: #2d3a4e;
            transform: scale(1.05);
        }
        .calendar-day.today {
            background: #3b82f6;
            color: white;
        }
        .calendar-day.other-month {
            opacity: 0.4;
        }
        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 6px;
            height: 6px;
            background: #f59e0b;
            border-radius: 50%;
        }
        .calendar-day-number {
            font-weight: 600;
        }
        
        /* Event liste under kalender */
        .event-list {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #1f2a3e;
        }
        .event-title {
            color: #94a3b8;
            font-size: 0.7rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .event-item {
            background: #1e293b;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-date {
            font-size: 0.7rem;
            color: #3b82f6;
        }
        .event-text {
            flex: 1;
            margin-left: 12px;
            color: white;
            font-size: 0.85rem;
        }
        .event-delete {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 1rem;
        }
        
        /* To-Do Liste styling */
        .todo-container {
            background: #111827;
            border-radius: 28px;
            padding: 1.5rem;
            border: 1px solid #1f2a3e;
        }
        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .todo-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
        }
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .todo-input {
            flex: 2;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 12px 16px;
            color: white;
        }
        .todo-select {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 12px 16px;
            color: white;
            cursor: pointer;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .btn-primary:hover { background: #2563eb; }
        .todo-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #1e293b;
            border-radius: 16px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .todo-item:hover { background: #2d3a4e; }
        .todo-checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: #10b981; }
        .todo-text { flex: 1; color: white; font-size: 0.9rem; }
        .todo-text.completed { text-decoration: line-through; color: #64748b; }
        .todo-category { background: #3b82f6; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; color: white; }
        .todo-delete { background: none; border: none; color: #f87171; cursor: pointer; font-size: 1.1rem; padding: 4px 8px; border-radius: 20px; }
        .todo-delete:hover { background: #7f1d1d; }
        .todo-stats { display: flex; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid #1f2a3e; color: #94a3b8; font-size: 0.75rem; }
        .filter-buttons { display: flex; gap: 12px; }
        .filter-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.75rem; padding: 4px 8px; }
        .filter-btn.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        
        /* Notatblokk */
        .notes-container {
            background: #111827;
            border-radius: 28px;
            padding: 1.5rem;
            border: 1px solid #1f2a3e;
        }
        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .notes-title { font-size: 1.2rem; font-weight: 600; color: white; }
        .notes-mappe-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .mappe-btn {
            background: #1e293b;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .mappe-btn.active { background: #3b82f6; color: white; }
        .notes-textarea {
            width: 100%;
            min-height: 150px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 16px;
            color: white;
            font-size: 0.9rem;
            resize: vertical;
        }
        .notes-textarea:focus { outline: none; border-color: #3b82f6; }
        .notes-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .notes-save-btn {
            background: #10b981;
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            color: white;
            cursor: pointer;
        }
        .notes-info { font-size: 0.7rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="pro-header">
            <div class="logo-area"><h1>WORKBENCH PRO</h1><p>planlegger | kalender | gjøremål | notater</p></div>
            <div class="user-area">
                <span class="user-name" id="currentUserDisplay"></span>
                <a href="dashboard.html" class="home-btn">🏠 Dashboard</a>
                <button id="logoutBtn" class="logout-btn">Logg ut</button>
            </div>
        </div>
        
        <!-- Kalender + To-Do Grid -->
        <div class="planner-grid">
            <!-- KALENDER -->
            <div class="calendar-container">
                <div class="calendar-header">
                    <div class="calendar-month" id="calendarMonth"></div>
                    <div class="calendar-nav">
                        <button id="prevMonthBtn">◀ Forrige</button>
                        <button id="nextMonthBtn">Neste ▶</button>
                        <button id="todayBtn">I dag</button>
                    </div>
                </div>
                <div class="calendar-weekdays" id="calendarWeekdays"></div>
                <div class="calendar-days" id="calendarDays"></div>
                <div class="event-list">
                    <div class="event-title">📅 KOMMENDE HENDELSER</div>
                    <div id="eventList"></div>
                </div>
            </div>
            
            <!-- TO-DO LISTE -->
            <div class="todo-container">
                <div class="todo-header">
                    <div class="todo-title">📋 Gjøremål</div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="active">Aktive</button>
                        <button class="filter-btn" data-filter="completed">Fullførte</button>
                        <button class="filter-btn" data-filter="all">Alle</button>
                    </div>
                </div>
                <div class="todo-input-group">
                    <input type="text" id="todoInput" class="todo-input" placeholder="Legg til ny oppgave...">
                    <select id="todoCategory" class="todo-select">
                        <option value="Arbeid">💼 Arbeid</option>
                        <option value="Privat">🏠 Privat</option>
                        <option value="Trening">💪 Trening</option>
                        <option value="Handling">🛒 Handling</option>
                        <option value="Annet">📌 Annet</option>
                    </select>
                    <button id="addTodoBtn" class="btn-primary">+ Legg til</button>
                </div>
                <div class="todo-list" id="todoList"></div>
                <div class="todo-stats">
                    <span id="todoStats"></span>
                </div>
            </div>
        </div>
        
        <!-- NOTATBLOKK -->
        <div class="notes-container">
            <div class="notes-header">
                <div class="notes-title">📝 Notatblokk</div>
                <div class="notes-mappe-buttons" id="notesMappeButtons">
                    <button class="mappe-btn active" data-mappe="personlig">👤 Personlig</button>
                    <button class="mappe-btn" data-mappe="arbeid">💼 Arbeid</button>
                    <button class="mappe-btn" data-mappe="ideer">💡 Ideer</button>
                    <button class="mappe-btn" data-mappe="handleliste">🛒 Handleliste</button>
                </div>
            </div>
            <textarea id="notesTextarea" class="notes-textarea" placeholder="Skriv notater her..."></textarea>
            <div class="notes-footer">
                <button id="saveNotesBtn" class="notes-save-btn">💾 Lagre notat</button>
                <div class="notes-info" id="notesInfo"></div>
            </div>
        </div>
    </div>

    <script>
        const currentUser = sessionStorage.getItem('workbench_currentUser');
        if (!currentUser) { window.location.href = 'index.html'; }
        document.getElementById('currentUserDisplay').innerText = currentUser;
        
        // ==================== KALENDER ====================
        let currentDate = new Date();
        let calendarEvents = [];
        
        function loadCalendarEvents() {
            const raw = localStorage.getItem(`calendar_events_${currentUser}`);
            if (raw) { calendarEvents = JSON.parse(raw); }
            else { calendarEvents = []; }
            renderCalendar();
            renderEventList();
        }
        
        function saveCalendarEvents() {
            localStorage.setItem(`calendar_events_${currentUser}`, JSON.stringify(calendarEvents));
        }
        
        function addCalendarEvent(date, title) {
            calendarEvents.push({ id: Date.now(), date: date, title: title });
            saveCalendarEvents();
            renderCalendar();
            renderEventList();
        }
        
        function deleteCalendarEvent(id) {
            calendarEvents = calendarEvents.filter(e => e.id !== id);
            saveCalendarEvents();
            renderCalendar();
            renderEventList();
        }
        
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();
            const monthNames = ['Januar', 'Februar', 'Mars', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('calendarMonth').innerHTML = `${monthNames[month]} ${year}`;
            const weekdays = ['MA', 'TI', 'ON', 'TO', 'FR', 'LØ', 'SØ'];
            document.getElementById('calendarWeekdays').innerHTML = weekdays.map(day => `<div class="calendar-weekday">${day}</div>`).join('');
            let daysHtml = '';
            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);
            for (let i = 0; i < startDayOfWeek; i++) {
                const prevDate = prevMonthDays - startDayOfWeek + i + 1;
                daysHtml += `<div class="calendar-day other-month"><span class="calendar-day-number">${prevDate}</span></div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                const hasEvent = calendarEvents.some(e => e.date === dateStr);
                daysHtml += `<div class="calendar-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}" data-date="${dateStr}"><span class="calendar-day-number">${d}</span></div>`;
            }
            const totalCells = Math.ceil((startDayOfWeek + daysInMonth) / 7) * 7;
            const remainingCells = totalCells - (startDayOfWeek + daysInMonth);
            for (let i = 1; i <= remainingCells; i++) {
                daysHtml += `<div class="calendar-day other-month"><span class="calendar-day-number">${i}</span></div>`;
            }
            document.getElementById('calendarDays').innerHTML = daysHtml;
            document.querySelectorAll('.calendar-day').forEach(day => {
                day.addEventListener('click', () => {
                    const date = day.getAttribute('data-date');
                    if (date) {
                        const title = prompt('Legg til hendelse for denne dagen:', '');
                        if (title && title.trim()) { addCalendarEvent(date, title.trim()); }
                    }
                });
            });
        }
        
        function renderEventList() {
            const sorted = [...calendarEvents].sort((a, b) => a.date.localeCompare(b.date));
            const container = document.getElementById('eventList');
            if (sorted.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">Ingen hendelser</div>';
                return;
            }
            container.innerHTML = sorted.slice(0, 10).map(e => `
                <div class="event-item">
                    <span class="event-date">${e.date}</span>
                    <span class="event-text">${escapeHtml(e.title)}</span>
                    <button class="event-delete" data-id="${e.id}">🗑️</button>
                </div>
            `).join('');
            document.querySelectorAll('.event-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteCalendarEvent(parseInt(btn.getAttribute('data-id'))));
            });
        }
        
        document.getElementById('prevMonthBtn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        document.getElementById('nextMonthBtn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
        document.getElementById('todayBtn').addEventListener('click', () => { currentDate = new Date(); renderCalendar(); });
        
        // ==================== TO-DO LISTE ====================
        let todos = [];
        let todoFilter = 'active';
        
        function loadTodos() {
            const raw = localStorage.getItem(`todos_${currentUser}`);
            todos = raw ? JSON.parse(raw) : [];
            renderTodos();
        }
        
        function saveTodos() { localStorage.setItem(`todos_${currentUser}`, JSON.stringify(todos)); renderTodos(); }
        
        function addTodo(text, category) {
            todos.push({ id: Date.now(), text: text, category: category, completed: false, created: new Date().toISOString() });
            saveTodos();
        }
        
        function toggleTodo(id) { const todo = todos.find(t => t.id === id); if (todo) { todo.completed = !todo.completed; saveTodos(); } }
        function deleteTodo(id) { todos = todos.filter(t => t.id !== id); saveTodos(); }
        
        function renderTodos() {
            let filtered = [...todos];
            if (todoFilter === 'active') filtered = filtered.filter(t => !t.completed);
            else if (todoFilter === 'completed') filtered = filtered.filter(t => t.completed);
            const completed = todos.filter(t => t.completed).length;
            document.getElementById('todoStats').innerHTML = `${completed}/${todos.length} fullført`;
            const container = document.getElementById('todoList');
            if (filtered.length === 0) { container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">Ingen oppgaver</div>'; return; }
            container.innerHTML = filtered.map(todo => `
                <div class="todo-item">
                    <input type="checkbox" class="todo-checkbox" data-id="${todo.id}" ${todo.completed ? 'checked' : ''}>
                    <div class="todo-text ${todo.completed ? 'completed' : ''}">${escapeHtml(todo.text)}</div>
                    <span class="todo-category">${todo.category}</span>
                    <button class="todo-delete" data-id="${todo.id}">🗑️</button>
                </div>
            `).join('');
            document.querySelectorAll('.todo-checkbox').forEach(cb => { cb.addEventListener('change', () => toggleTodo(parseInt(cb.getAttribute('data-id')))); });
            document.querySelectorAll('.todo-delete').forEach(btn => { btn.addEventListener('click', () => deleteTodo(parseInt(btn.getAttribute('data-id')))); });
        }
        
        document.getElementById('addTodoBtn').addEventListener('click', () => {
            const text = document.getElementById('todoInput').value.trim();
            const category = document.getElementById('todoCategory').value;
            if (text) { addTodo(text, category); document.getElementById('todoInput').value = ''; }
        });
        document.getElementById('todoInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('addTodoBtn').click(); });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                todoFilter = btn.getAttribute('data-filter');
                renderTodos();
            });
        });
        
        // ==================== NOTATBLOKK ====================
        let currentMappe = 'personlig';
        let notesData = { personlig: '', arbeid: '', ideer: '', handleliste: '' };
        
        function loadNotes() {
            const raw = localStorage.getItem(`notes_${currentUser}`);
            if (raw) { notesData = JSON.parse(raw); }
            document.getElementById('notesTextarea').value = notesData[currentMappe] || '';
            document.getElementById('notesInfo').innerHTML = `📁 Mappe: ${currentMappe} | Klar`;
        }
        
        function saveNotes() {
            notesData[currentMappe] = document.getElementById('notesTextarea').value;
            localStorage.setItem(`notes_${currentUser}`, JSON.stringify(notesData));
            document.getElementById('notesInfo').innerHTML = `✅ Lagret! | 📁 ${currentMappe} | ${new Date().toLocaleTimeString()}`;
            setTimeout(() => { document.getElementById('notesInfo').innerHTML = `📁 Mappe: ${currentMappe} | Klar`; }, 2000);
        }
        
        document.querySelectorAll('.mappe-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mappe-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMappe = btn.getAttribute('data-mappe');
                document.getElementById('notesTextarea').value = notesData[currentMappe] || '';
                document.getElementById('notesInfo').innerHTML = `📁 Mappe: ${currentMappe}`;
            });
        });
        document.getElementById('saveNotesBtn').addEventListener('click', saveNotes);
        
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        
        document.getElementById('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('workbench_currentUser'); window.location.href = 'index.html'; });
        
        loadCalendarEvents();
        loadTodos();
        loadNotes();
    </script>
</body>
</html>
