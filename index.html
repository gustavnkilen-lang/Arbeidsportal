<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBench Pro - Logg inn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>WORKBENCH PRO</h1>
                <p>Arbeidsportal | Timelogg | Lønn | Lommebok</p>
            </div>
            
            <div id="authMessage" class="auth-message"></div>
            
            <div class="auth-section">
                <h3>Logg inn</h3>
                <div class="form-group">
                    <label>Brukernavn</label>
                    <input type="text" id="loginUsername" class="input-field" placeholder="ditt brukernavn">
                </div>
                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" id="loginPassword" class="input-field" placeholder="••••••">
                </div>
                <button id="loginBtn" class="btn-primary btn-full">Logg inn</button>
            </div>
            
            <div class="auth-divider"></div>
            
            <div class="auth-section">
                <h3>Opprett ny konto</h3>
                <div class="form-group">
                    <label>Nytt brukernavn</label>
                    <input type="text" id="regUsername" class="input-field" placeholder="velg brukernavn">
                </div>
                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" id="regPassword" class="input-field" placeholder="velg passord">
                </div>
                <div class="form-group">
                    <label>Gjenta passord</label>
                    <input type="password" id="regPasswordConfirm" class="input-field" placeholder="gjenta passord">
                </div>
                <button id="registerBtn" class="btn-secondary btn-full">Opprett konto</button>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="auth.js"></script>
</body>
</html>
