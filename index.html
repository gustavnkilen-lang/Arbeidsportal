<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WorkBench Pro - Total arbeidsportal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: #0a0f1a;
            min-height: 100vh;
            padding: 20px;
        }

        .app-wrapper {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header pro */
        .pro-header {
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            border-radius: 24px;
            padding: 20px 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .logo-area h1 {
            color: white;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .logo-area p {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #1e293b;
            padding: 8px 20px;
            border-radius: 60px;
        }
        .user-name {
            color: #e2e8f0;
            font-weight: 500;
        }
        .logout-btn {
            background: #dc2626;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: #b91c1c;
        }

        /* KPI Grid - Finans dashboard */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 28px;
            padding: 22px 24px;
            border: 1px solid rgba(71, 85, 105, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }
        .kpi-card:hover {
            transform: translateY(-2px);
            border-color: #3b82f6;
        }
        .kpi-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .kpi-value {
            font-size: 2.4rem;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: -1px;
        }
        .kpi-sub {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
        }
        .positive {
            color: #4ade80;
        }
        .negative {
            color: #f87171;
        }

        /* Hovedinnhold - Tabs design */
        .nav-tabs-pro {
            display: flex;
            background: #0f172a;
            border-radius: 60px;
            padding: 6px;
            margin-bottom: 28px;
            gap: 6px;
            flex-wrap: wrap;
            border: 1px solid #1e293b;
        }
        .tab-pro {
            background: transparent;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-pro.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .tab-pro:hover:not(.active) {
            background: #1e293b;
            color: #cbd5e1;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tab-pane.active-pane {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Kort og tabeller */
        .card-glass {
            background: #111827;
            border-radius: 28px;
            padding: 1.6rem;
            margin-bottom: 1.8rem;
            border: 1px solid #1f2a3e;
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 1.2rem;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .input-field {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 12px 16px;
            color: white;
            font-size: 0.9rem;
            width: 100%;
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
        }
        label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #94a3b8;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: scale(0.98);
        }
        .btn-danger {
            background: #dc2626;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            text-align: left;
            padding: 12px 8px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.7rem;
            border-bottom: 1px solid #1f2a3e;
        }
        .data-table td {
            padding: 12px 8px;
            color: #e2e8f0;
            font-size: 0.85rem;
            border-bottom: 1px solid #1e293b;
        }
        .action-btn {
            background: none;
            border: none;
            color: #f97316;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .scroll-table {
            max-height: 320px;
            overflow-y: auto;
        }
        .badge-stat {
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
        }
        hr {
            border-color: #1e293b;
            margin: 16px 0;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        @media (max-width: 700px) {
            .kpi-value { font-size: 1.6rem; }
            .tab-pro { padding: 8px 16px; }
        }
    </style>
</head>
<body>
<div class="app-wrapper" id="rootApp"></div>

<script>
    // ======================= PROFESJONELL WORKBENCH =======================
    // Data som lagres: timerLogg, fravær, månedslønn, utlegg/utgifter (wallet)
    // Persistering: ALLE endringer lagres instant, ingen tilbakegang til start-side.
    // Lommebok: saldo, minus penger brukt, pluss inntekt (lønn)
    
    let currentUser = null;
    
    // ---------- BRUKERSYSTEM ----------
    function getUsers() {
        const raw = localStorage.getItem("pro_work_users");
        return raw ? JSON.parse(raw) : {};
    }
    function saveUsers(users) { localStorage.setItem("pro_work_users", JSON.stringify(users)); }
    
    function registerUser(username, password) {
        const users = getUsers();
        if (users[username]) return { success: false, message: "Brukernavn eksisterer" };
        if (!username.trim() || !password.trim()) return { success: false, message: "Fyll ut felter" };
        users[username] = { password, created: new Date().toISOString() };
        saveUsers(users);
        // init workdata med wallet
        if (!localStorage.getItem(`workbench_${username}`)) {
            const initData = {
                timerLogg: [],
                fravær: [],
                månedslønn: [],
                walletHistory: [],  // {id, dato, beskrivelse, belop, type: "utgift" eller "inntekt"}
                saldo: 0
            };
            localStorage.setItem(`workbench_${username}`, JSON.stringify(initData));
        }
        return { success: true };
    }
    
    function loginUser(username, password) {
        const users = getUsers();
        if (!users[username]) return false;
        return users[username].password === password;
    }
    
    function loadWorkData() {
        if (!currentUser) return null;
        const raw = localStorage.getItem(`workbench_${currentUser}`);
        if (raw) return JSON.parse(raw);
        return { timerLogg: [], fravær: [], månedslønn: [], walletHistory: [], saldo: 0 };
    }
    
    function saveWorkData(data) {
        if (!currentUser) return;
        localStorage.setItem(`workbench_${currentUser}`, JSON.stringify(data));
    }
    
    // Hjelpere
    function beregnTimer(start, slutt) {
        if (!start || !slutt) return 0;
        let [sh, sm] = start.split(':').map(Number);
        let [eh, em] = slutt.split(':').map(Number);
        let total = (eh + em/60) - (sh + sm/60);
        if (total < 0) total += 24;
        return parseFloat(total.toFixed(2));
    }
    
    // Oppdater visning (re-render hele dashboard, men BEHOLDER data, ingen tilbakestilling)
    function renderFullDashboard() {
        if (!currentUser) {
            renderAuthScreen();
            return;
        }
        const data = loadWorkData();
        if (!data.saldo && data.saldo !== 0) data.saldo = 0;
        if (!data.walletHistory) data.walletHistory = [];
        
        const totalInntekt = data.månedslønn.reduce((sum, m) => sum + (m.beløp || 0), 0);
        const totalUtgift = data.walletHistory.filter(w => w.type === 'utgift').reduce((sum, w) => sum + w.belop, 0);
        const totalLønnRegistrert = data.månedslønn.length;
        const totaleTimer = data.timerLogg.reduce((sum, t) => sum + t.totalTimer, 0);
        
        const root = document.getElementById('rootApp');
        root.innerHTML = `
            <div class="pro-header">
                <div class="logo-area">
                    <h1>WORKBENCH PRO</h1>
                    <p>timelogg | fravær | finans | lommebok</p>
                </div>
                <div class="user-area">
                    <span class="user-name">${currentUser}</span>
                    <button class="logout-btn" id="globalLogout">Logg ut</button>
                </div>
            </div>
            
            <!-- KPI Dashboard -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-label">NÅVÆRENDE SALDO</div>
                    <div class="kpi-value">${data.saldo.toLocaleString('nb-NO')} kr</div>
                    <div class="kpi-sub">Lommebok / kontanter</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">TOTAL LØNN (REG.)</div>
                    <div class="kpi-value">${totalInntekt.toLocaleString('nb-NO')} kr</div>
                    <div class="kpi-sub">fra ${totalLønnRegistrert} måneder</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">TOTAL UTGIFTER</div>
                    <div class="kpi-value negative">- ${totalUtgift.toLocaleString('nb-NO')} kr</div>
                    <div class="kpi-sub">historiske utgifter</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">ARBEIDSTIMER (TOT)</div>
                    <div class="kpi-value">${totaleTimer.toFixed(1)} h</div>
                    <div class="kpi-sub">registrerte timer</div>
                </div>
            </div>
            
            <!-- Tabs -->
            <div class="nav-tabs-pro">
                <button class="tab-pro active" data-pane="paneTimereg">TIMEREG.</button>
                <button class="tab-pro" data-pane="paneFravær">FRAVÆR</button>
                <button class="tab-pro" data-pane="paneLonn">LØNN & LØNNSHIST.</button>
                <button class="tab-pro" data-pane="paneWallet">LOMMEBOK / UTGIFTER</button>
                <button class="tab-pro" data-pane="paneTotal">ANALYSE & DATA</button>
            </div>
            
            <!-- Panel 1: Timeregistrering -->
            <div id="paneTimereg" class="tab-pane active-pane">
                <div class="card-glass">
                    <div class="card-title">Registrer arbeidstid (klokkeslett)</div>
                    <div class="form-row">
                        <div><label>DATO</label><input type="date" id="timerDato" class="input-field" value="${new Date().toISOString().slice(0,10)}"></div>
                        <div><label>START</label><input type="time" id="startTid" class="input-field" value="08:00"></div>
                        <div><label>SLUTT</label><input type="time" id="sluttTid" class="input-field" value="16:00"></div>
                        <div><label>BESKRIVELSE</label><input type="text" id="timerBeskrivelse" class="input-field" placeholder="Prosjekt"></div>
                    </div>
                    <button id="leggTilTimerBtn" class="btn-primary">+ Legg til timelogg</button>
                </div>
                <div class="card-glass">
                    <div class="card-title">📋 Timelogg historikk</div>
                    <div class="scroll-table">
                        <table class="data-table">
                            <thead><tr><th>DATO</th><th>START</th><th>SLUTT</th><th>TIMER</th><th>BESKRIVELSE</th><th></th></tr></thead>
                            <tbody id="timerTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Panel 2: Fravær -->
            <div id="paneFravær" class="tab-pane">
                <div class="card-glass">
                    <div class="card-title">Registrer fravær</div>
                    <div class="form-row">
                        <div><label>DATO</label><input type="date" id="fravDato" class="input-field"></div>
                        <div><label>TIMER FRAVÆR</label><input type="number" step="0.5" id="fravTimer" class="input-field" placeholder="7.5"></div>
                        <div><label>ÅRSAK</label><input type="text" id="fravArsak" class="input-field" placeholder="sykdom"></div>
                    </div>
                    <button id="leggFraværBtn" class="btn-primary">Registrer fravær</button>
                </div>
                <div class="card-glass">
                    <div class="card-title">Fraværsoversikt</div>
                    <div class="scroll-table"><table class="data-table"><thead><tr><th>DATO</th><th>TIMER</th><th>ÅRSAK</th><th></th></tr></thead><tbody id="fraværTableBody"></tbody></table></div>
                </div>
            </div>
            
            <!-- Panel 3: Lønn -->
            <div id="paneLonn" class="tab-pane">
                <div class="card-glass">
                    <div class="card-title">Registrer månedslønn (brutto)</div>
                    <div class="form-row">
                        <div><label>MÅNED</label><input type="month" id="lonnMaaned" class="input-field" value="${new Date().toISOString().slice(0,7)}"></div>
                        <div><label>BELØP (NOK)</label><input type="number" id="lonnBelop" class="input-field" placeholder="38500"></div>
                        <div><label>KOMMENTAR</label><input type="text" id="lonnKommentar" class="input-field"></div>
                    </div>
                    <button id="regLonnBtn" class="btn-primary">Registrer lønn</button>
                    <div class="flex-between" style="margin-top:16px;"><span>➕ Legg til lønn i lommebok:</span><button id="leggTilLommebokFraLonn" class="btn-outline" style="padding:6px 16px;">+ Overfør til saldo</button></div>
                </div>
                <div class="card-glass">
                    <div class="card-title">Lønnshistorikk (tabell)</div>
                    <div class="scroll-table"><table class="data-table"><thead><tr><th>MÅNED</th><th>BELØP</th><th>KOMMENTAR</th><th></th></tr></thead><tbody id="lonnTableBody"></tbody></table></div>
                </div>
            </div>
            
            <!-- Panel 4: Lommebok / Utgifter -->
            <div id="paneWallet" class="tab-pane">
                <div class="card-glass">
                    <div class="card-title">💰 Legg til utgift eller inntekt (kontantstrøm)</div>
                    <div class="form-row">
                        <div><label>BESKRIVELSE</label><input type="text" id="utenBeskrivelse" class="input-field" placeholder="Mat, regning, lønnstillegg"></div>
                        <div><label>BELØP</label><input type="number" id="utenBelop" class="input-field" placeholder="0"></div>
                        <div><label>TYPE</label><select id="utenType" class="input-field"><option value="utgift">Utgift (minus)</option><option value="inntekt">Inntekt (plus)</option></select></div>
                        <div><label>DATO</label><input type="date" id="utenDato" class="input-field" value="${new Date().toISOString().slice(0,10)}"></div>
                    </div>
                    <button id="leggTilTransaksjonBtn" class="btn-primary">Legg til i lommebok</button>
                </div>
                <div class="card-glass">
                    <div class="card-title">📜 Transaksjonshistorikk & Saldoendringer</div>
                    <div class="scroll-table"><table class="data-table"><thead><tr><th>DATO</th><th>BESKRIVELSE</th><th>BELØP</th><th></th></tr></thead><tbody id="walletTableBody"></tbody></table></div>
                </div>
            </div>
            
            <!-- Panel 5: Total analyse -->
            <div id="paneTotal" class="tab-pane">
                <div class="card-glass">
                    <div class="card-title">📊 NØKKELTALL & RAPPORT</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                        <div><span class="kpi-label">Gjennomsnittlig månedslønn</span><div class="kpi-value" style="font-size:1.6rem;">${(totalInntekt / (data.månedslønn.length||1)).toFixed(0)} kr</div></div>
                        <div><span class="kpi-label">Totalt fravær (timer)</span><div class="kpi-value" style="font-size:1.6rem;">${data.fravær.reduce((s,f)=>s+f.timerFravær,0)} h</div></div>
                        <div><span class="kpi-label">Måneder med lønn</span><div>${data.månedslønn.length}</div></div>
                        <div><span class="kpi-label">Antall transaksjoner</span><div>${data.walletHistory.length}</div></div>
                    </div>
                    <hr>
                    <div class="card-title">📆 Timelogg per måned (aggregering)</div>
                    <div id="aggregeringContainer" style="color:#cbd5e1; font-size:0.8rem;"></div>
                </div>
            </div>
        `;
        
        // Hendelser: ingen tilbake til start, alle endringer lagres og rerender
        document.getElementById('globalLogout')?.addEventListener('click', () => { currentUser = null; renderFullDashboard(); });
        
        // TAB logikk
        const panes = ['paneTimereg', 'paneFravær', 'paneLonn', 'paneWallet', 'paneTotal'];
        document.querySelectorAll('.tab-pro').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-pro').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const target = btn.getAttribute('data-pane');
                panes.forEach(p => {
                    const el = document.getElementById(p);
                    if (el) el.classList.remove('active-pane');
                });
                document.getElementById(target)?.classList.add('active-pane');
            });
        });
        
        // Fyll tabeller
        const current = loadWorkData();
        // timer tabell
        const timerTbody = document.getElementById('timerTableBody');
        if (timerTbody) {
            timerTbody.innerHTML = [...current.timerLogg].sort((a,b)=>b.dato.localeCompare(a.dato)).map(t => `
                <tr><td>${t.dato}</td><td>${t.startKl}</td><td>${t.sluttKl}</td><td>${t.totalTimer}</td><td>${t.beskrivelse}</td><td><button class="action-btn slettTimerBtn" data-id="${t.id}">Slett</button></td></tr>
            `).join('');
            document.querySelectorAll('.slettTimerBtn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseFloat(btn.getAttribute('data-id'));
                    let d = loadWorkData();
                    d.timerLogg = d.timerLogg.filter(l => l.id !== id);
                    saveWorkData(d);
                    renderFullDashboard();
                });
            });
        }
        
        // Fravær
        const fravTbody = document.getElementById('fraværTableBody');
        if (fravTbody) {
            fravTbody.innerHTML = [...current.fravær].sort((a,b)=>b.dato.localeCompare(a.dato)).map(f => `
                <tr><td>${f.dato}</td><td>${f.timerFravær}</td><td>${f.årsak}</td><td><button class="action-btn slettFraværBtn" data-id="${f.id}">Slett</button></td></tr>
            `).join('');
            document.querySelectorAll('.slettFraværBtn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseFloat(btn.getAttribute('data-id'));
                    let d = loadWorkData();
                    d.fravær = d.fravær.filter(f => f.id !== id);
                    saveWorkData(d);
                    renderFullDashboard();
                });
            });
        }
        
        // Lønn
        const lonnTbody = document.getElementById('lonnTableBody');
        if (lonnTbody) {
            lonnTbody.innerHTML = [...current.månedslønn].sort((a,b)=>b.måned.localeCompare(a.måned)).map(l => `
                <tr><td>${l.måned}</td><td>${l.beløp.toLocaleString()} kr</td><td>${l.kommentar || '-'}</td><td><button class="action-btn slettLonnBtn" data-month="${l.måned}">Slett</button></td></tr>
            `).join('');
            document.querySelectorAll('.slettLonnBtn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const month = btn.getAttribute('data-month');
                    let d = loadWorkData();
                    d.månedslønn = d.månedslønn.filter(m => m.måned !== month);
                    saveWorkData(d);
                    renderFullDashboard();
                });
            });
        }
        
        // Wallet
        const walletBody = document.getElementById('walletTableBody');
        if (walletBody) {
            walletBody.innerHTML = [...current.walletHistory].sort((a,b)=>b.dato.localeCompare(a.dato)).map(w => `
                <tr><td>${w.dato}</td><td>${w.beskrivelse} ${w.type === 'utgift' ? '(utgift)' : '(inntekt)'}</td><td style="${w.type === 'utgift' ? 'color:#f87171' : 'color:#4ade80'}">${w.type === 'utgift' ? '-' : '+'} ${w.belop.toLocaleString()} kr</td><td><button class="action-btn slettTransBtn" data-id="${w.id}">Slett</button></td></tr>
            `).join('');
            document.querySelectorAll('.slettTransBtn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseFloat(btn.getAttribute('data-id'));
                    let d = loadWorkData();
                    const trans = d.walletHistory.find(t => t.id === id);
                    if (trans) {
                        if (trans.type === 'utgift') d.saldo += trans.belop;
                        else d.saldo -= trans.belop;
                        d.walletHistory = d.walletHistory.filter(t => t.id !== id);
                        saveWorkData(d);
                        renderFullDashboard();
                    }
                });
            });
        }
        
        // Aggregering
        const aggDiv = document.getElementById('aggregeringContainer');
        if (aggDiv && current.timerLogg.length) {
            const byMonth = {};
            current.timerLogg.forEach(t => {
                const month = t.dato.slice(0,7);
                byMonth[month] = (byMonth[month] || 0) + t.totalTimer;
            });
            aggDiv.innerHTML = Object.entries(byMonth).sort().map(([m, h]) => `<div>${m}: ${h.toFixed(1)} timer</div>`).join('');
        } else if(aggDiv) aggDiv.innerHTML = 'Ingen timer enda.';
        
        // Event: Legg til timer
        document.getElementById('leggTilTimerBtn')?.addEventListener('click', () => {
            const dato = document.getElementById('timerDato').value;
            const start = document.getElementById('startTid').value;
            const slutt = document.getElementById('sluttTid').value;
            const beskrivelse = document.getElementById('timerBeskrivelse').value || "Arbeid";
            if (!dato || !start || !slutt) return alert("Fyll dato og klokkeslett");
            const timer = beregnTimer(start, slutt);
            if (timer <= 0) return alert("Sluttid må være etter start");
            let d = loadWorkData();
            d.timerLogg.push({ id: Date.now(), dato, startKl: start, sluttKl: slutt, totalTimer: timer, beskrivelse });
            saveWorkData(d);
            renderFullDashboard();
        });
        
        // Fravær
        document.getElementById('leggFraværBtn')?.addEventListener('click', () => {
            const dato = document.getElementById('fravDato').value;
            const timer = parseFloat(document.getElementById('fravTimer').value);
            const arsak = document.getElementById('fravArsak').value || "Ikke oppgitt";
            if (!dato || isNaN(timer) || timer <= 0) return alert("Gyldig dato og timer");
            let d = loadWorkData();
            d.fravær.push({ id: Date.now(), dato, timerFravær: timer, årsak: arsak });
            saveWorkData(d);
            renderFullDashboard();
        });
        
        // Lønn registrer
        document.getElementById('regLonnBtn')?.addEventListener('click', () => {
            const måned = document.getElementById('lonnMaaned').value;
            const beløp = parseFloat(document.getElementById('lonnBelop').value);
            const kommentar = document.getElementById('lonnKommentar').value;
            if (!måned || isNaN(beløp)) return alert("Fyll ut beløp");
            let d = loadWorkData();
            const idx = d.månedslønn.findIndex(m => m.måned === måned);
            if (idx !== -1) d.månedslønn[idx] = { måned, beløp, kommentar };
            else d.månedslønn.push({ måned, beløp, kommentar });
            saveWorkData(d);
            renderFullDashboard();
        });
        
        // Overfør lønn til lommebok
        document.getElementById('leggTilLommebokFraLonn')?.addEventListener('click', () => {
            const måned = document.getElementById('lonnMaaned').value;
            let d = loadWorkData();
            const lonnPost = d.månedslønn.find(m => m.måned === måned);
            if (!lonnPost) return alert("Registrer først lønn for valgt måned");
            d.saldo = (d.saldo || 0) + lonnPost.beløp;
            d.walletHistory.push({ id: Date.now(), dato: new Date().toISOString().slice(0,10), beskrivelse: `Lønn ${måned}`, belop: lonnPost.beløp, type: "inntekt" });
            saveWorkData(d);
            renderFullDashboard();
        });
        
        // Transaksjon lommebok
        document.getElementById('leggTilTransaksjonBtn')?.addEventListener('click', () => {
            const beskrivelse = document.getElementById('utenBeskrivelse').value;
            const belop = parseFloat(document.getElementById('utenBelop').value);
            const type = document.getElementById('utenType').value;
            const dato = document.getElementById('utenDato').value;
            if (!beskrivelse || isNaN(belop) || belop <= 0) return alert("Fyll ut korrekt");
            let d = loadWorkData();
            const endring = type === 'utgift' ? -belop : belop;
            d.saldo = (d.saldo || 0) + endring;
            d.walletHistory.push({ id: Date.now(), dato, beskrivelse, belop, type });
            saveWorkData(d);
            renderFullDashboard();
        });
    }
