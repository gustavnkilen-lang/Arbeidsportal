<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBench Pro - Logg inn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0a0f1a 0%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-container { width: 100%; max-width: 500px; }
        .auth-card { background: #111827; border-radius: 32px; padding: 32px; border: 1px solid #1e293b; box-shadow: 0 25px 40px -12px rgba(0,0,0,0.5); }
        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-header h1 { color: white; font-size: 1.8rem; }
        .auth-header p { color: #94a3b8; font-size: 0.85rem; margin-top: 6px; }
        .auth-section h3 { color: #e2e8f0; font-size: 1.1rem; margin-bottom: 16px; }
        .auth-divider { height: 1px; background: #1e293b; margin: 24px 0; }
        .auth-message { margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { font-size: 0.7rem; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 6px; text-transform: uppercase; }
        .input-field { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 12px 16px; color: white; font-size: 0.9rem; width: 100%; }
        .btn-primary { background: #3b82f6; border: none; border-radius: 40px; padding: 12px 24px; font-weight: 600; color: white; cursor: pointer; width: 100%; }
        .btn-secondary { background: #4a6a85; border: none; border-radius: 40px; padding: 12px 24px; font-weight: 600; color: white; cursor: pointer; width: 100%; }
        .loading { opacity: 0.7; pointer-events: none; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; background: #10b981; color: white; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>WORKBENCH PRO</h1>
                <p>Lokal database (IndexedDB) | Flere brukere</p>
            </div>
            <div id="authMessage" class="auth-message"></div>
            <div class="auth-section">
                <h3>Logg inn</h3>
                <div class="form-group">
                    <label>Brukernavn</label>
                    <input type="text" id="loginUsername" class="input-field" placeholder="ditt brukernavn">
                </div>
                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" id="loginPassword" class="input-field" placeholder="••••••">
                </div>
                <button id="loginBtn" class="btn-primary">Logg inn</button>
            </div>
            <div class="auth-divider"></div>
            <div class="auth-section">
                <h3>Opprett ny konto</h3>
                <div class="form-group">
                    <label>Brukernavn</label>
                    <input type="text" id="regUsername" class="input-field" placeholder="velg brukernavn">
                </div>
                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" id="regPassword" class="input-field" placeholder="velg passord">
                </div>
                <div class="form-group">
                    <label>Gjenta passord</label>
                    <input type="password" id="regPasswordConfirm" class="input-field" placeholder="gjenta passord">
                </div>
                <button id="registerBtn" class="btn-secondary">Opprett konto</button>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <span id="dbStatus" class="status-badge">🟢 IndexedDB aktiv</span>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script>
        let dbReady = false;
        
        async function init() {
            try {
                await initDatabase();
                dbReady = true;
                document.getElementById('dbStatus').innerHTML = '🟢 IndexedDB aktiv';
                document.getElementById('dbStatus').style.background = '#10b981';
            } catch (error) {
                console.error('Database init error:', error);
                document.getElementById('dbStatus').innerHTML = '🔴 Database feil';
                document.getElementById('dbStatus').style.background = '#dc2626';
            }
            
            // Sjekk om allerede innlogget
            const currentUser = sessionStorage.getItem('workbench_currentUser');
            if (currentUser) {
                window.location.href = 'dashboard.html';
            }
        }
        
        // Login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            if (!dbReady) { alert('Venter på database...'); return; }
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const result = await loginUserDB(username, password);
            const msgDiv = document.getElementById('authMessage');
            
            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                msgDiv.innerHTML = `<div style="background:#450a0a; padding:12px; border-radius:16px; color:#f87171;">${result.message}</div>`;
            }
        });
        
        // Register
        document.getElementById('registerBtn').addEventListener('click', async () => {
            if (!dbReady) { alert('Venter på database...'); return; }
            
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            const result = await registerUserDB(username, password, '');
            const msgDiv = document.getElementById('authMessage');
            
            if (result.success) {
                msgDiv.innerHTML = `<div style="background:#064e3b; padding:12px; border-radius:16px; color:#4ade80;">${result.message} Du kan nå logge inn.</div>`;
                document.getElementById('regUsername').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regPasswordConfirm').value = '';
                document.getElementById('loginUsername').value = username;
            } else {
                msgDiv.innerHTML = `<div style="background:#450a0a; padding:12px; border-radius:16px; color:#f87171;">${result.message}</div>`;
            }
        });
        
        init();
    </script>
</body>
</html>
