<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBench Pro - Timeregistrering</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <div class="app-wrapper">
        <div class="pro-header">
            <div class="logo-area">
                <h1>WORKBENCH PRO</h1>
                <p>timelogg | fravær | finans | lommebok</p>
            </div>
            <div class="user-area">
                <span class="user-name" id="currentUserDisplay"></span>
                <a href="dashboard.html" class="home-btn">🏠 Hjem</a>
                <button id="logoutBtn" class="logout-btn">Logg ut</button>
            </div>
        </div>
        
        <div class="page-title">
            <h2>Timeregistrering</h2>
            <p>Registrer arbeidstimer med start- og sluttidspunkt</p>
        </div>
        
        <div class="card-glass">
            <div class="card-title">Registrer arbeidstid</div>
            <div class="form-row">
                <div><label>DATO</label><input type="date" id="timerDato" class="input-field"></div>
                <div><label>START (kl.)</label><input type="time" id="startTid" class="input-field" value="08:00"></div>
                <div><label>SLUTT (kl.)</label><input type="time" id="sluttTid" class="input-field" value="16:00"></div>
                <div><label>BESKRIVELSE</label><input type="text" id="timerBeskrivelse" class="input-field" placeholder="Prosjekt / oppgave"></div>
            </div>
            <button id="leggTilTimerBtn" class="btn-primary">+ Legg til timelogg</button>
        </div>
        
        <div class="card-glass">
            <div class="card-title">Timelogg historikk</div>
            <div class="scroll-table">
                <table class="data-table">
                    <thead>
                        <tr><th>DATO</th><th>START</th><th>SLUTT</th><th>TIMER</th><th>BESKRIVELSE</th><th></th></tr>
                    </thead>
                    <tbody id="timerTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="timereg.js"></script>
</body>
</html>
